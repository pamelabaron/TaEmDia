name: Deploy

# Põe no ar o que foi enviado para a branch principal.
#
# Roda **depois** do CI, e só se ele tiver passado: teste quebrado não vira
# site no ar. É por isso que o gatilho é workflow_run e não push.
#
# O caminho, em duas etapas:
#   1. compila as imagens aqui e as guarda no GitHub;
#   2. pede à AWS que mande o servidor baixar e trocar.
#
# Nenhuma etapa usa SSH. A AWS conversa com a máquina por dentro, pelo agente
# que já vem instalado no Ubuntu.
#
# A autenticação com a AWS é por chave de usuário técnico, e não por confiança
# federada (OIDC), que seria tecnicamente melhor por não guardar credencial
# nenhuma. O motivo é concreto: nesta conta, criar o provedor de identidade
# exige "ativar recursos avançados", e a própria AWS avisa que isso **não pode
# ser desfeito** e **remove o limite de gastos da conta, sem poder recriá-lo**.
# Trocar um limite de gastos permanente por um método de login não compensa num
# projeto de faculdade.
#
# O risco da chave é contido pela permissão: ela só consegue mandar comando
# nesta única máquina. Não cria recurso, não lê banco, não gasta.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Permite subir na mão pelo site do GitHub, sem precisar enviar código.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------- imagens
  imagens:
    name: Compilar e guardar as imagens
    runs-on: ubuntu-latest
    # Na chamada manual não existe workflow_run, e a condição precisa aceitar
    # os dois casos.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    outputs:
      versao: ${{ steps.versao.outputs.valor }}

    steps:
      - name: Descobrir qual commit subir
        id: versao
        run: |
          # No gatilho por workflow_run, o commit é o que o CI testou, não o
          # topo da branch: entre um e outro pode ter entrado código que
          # ninguém testou ainda.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "valor=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar o código dessa versão
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.versao.outputs.valor }}

      - name: Preparar o compilador de imagens
        uses: docker/setup-buildx-action@v3

      - name: Entrar no guardador de imagens do GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar a API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRO }}/taemdia-backend:${{ steps.versao.outputs.valor }}
            ${{ env.REGISTRO }}/taemdia-backend:latest
          # Guarda o trabalho da compilação entre execuções: sem isto, cada
          # subida recompila tudo do zero.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Compilar o site
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRO }}/taemdia-frontend:${{ steps.versao.outputs.valor }}
            ${{ env.REGISTRO }}/taemdia-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ----------------------------------------------------------------- trocar
  trocar:
    name: Trocar a versão no servidor
    runs-on: ubuntu-latest
    needs: imagens

    permissions:
      contents: read

    steps:
      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CHAVE_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CHAVE_SECRETA }}
          aws-region: ${{ vars.AWS_REGIAO || 'us-east-2' }}

      - name: Mandar o servidor baixar e trocar
        env:
          VERSAO: ${{ needs.imagens.outputs.versao }}
          INSTANCIA: ${{ secrets.AWS_INSTANCIA }}
        run: |
          set -euo pipefail

          # O script vai para um arquivo, e o arquivo vira JSON com jq. Montar
          # os parâmetros na forma abreviada (commands="...") quebra com script
          # de várias linhas: a CLI corta no espaço e manda só o primeiro
          # pedaço, sem reclamar.
          cat > /tmp/trocar.sh <<SCRIPT
          set -euo pipefail
          cd /home/ubuntu/TaEmDia

          # Traz o compose e a configuração do Nginx desta versão. As imagens
          # já vêm prontas; aqui só o que é arquivo de configuração.
          git fetch --all --prune
          git reset --hard ${VERSAO}

          export VERSAO=${VERSAO}
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

          # Não é opcional: o Nginx guarda o endereço interno dos containers
          # de quando subiu, e sem reiniciar o site responde 502. Já aconteceu.
          docker compose -f docker-compose.prod.yml restart nginx

          sleep 5
          curl -sf -o /dev/null -k https://localhost/ || { echo "o site nao respondeu"; exit 1; }

          # O disco tem pouco mais de 9 GB livres e cada subida deixa a imagem
          # antiga para trás.
          docker image prune -af --filter "until=72h" >/dev/null
          echo "no ar: ${VERSAO}"
          SCRIPT

          jq -Rs '{commands: [.]}' /tmp/trocar.sh > /tmp/parametros.json

          ID=$(aws ssm send-command             --instance-ids "$INSTANCIA"             --document-name "AWS-RunShellScript"             --comment "Deploy ${VERSAO}"             --parameters file:///tmp/parametros.json             --query "Command.CommandId" --output text)

          echo "Comando enviado: $ID"

          # Espera o fim. Sem isto o robô fica verde enquanto o servidor
          # quebrou, que é pior do que não ter robô nenhum.
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCIA" || true

          ESTADO=$(aws ssm get-command-invocation \
            --command-id "$ID" --instance-id "$INSTANCIA" \
            --query "Status" --output text)

          echo "--- saída do servidor ---"
          aws ssm get-command-invocation \
            --command-id "$ID" --instance-id "$INSTANCIA" \
            --query "StandardOutputContent" --output text
          echo "--- erros ---"
          aws ssm get-command-invocation \
            --command-id "$ID" --instance-id "$INSTANCIA" \
            --query "StandardErrorContent" --output text

          if [ "$ESTADO" != "Success" ]; then
            echo "A troca falhou no servidor (estado: $ESTADO)."
            exit 1
          fi

      - name: Conferir que o site respondeu de fora
        run: |
          set -euo pipefail
          for tentativa in 1 2 3 4 5; do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' https://taemdia.duckdns.org/ || true)
            [ "$CODIGO" = "200" ] && { echo "site no ar (HTTP 200)"; exit 0; }
            echo "tentativa $tentativa: HTTP $CODIGO"
            sleep 10
          done
          echo "O site não respondeu 200 depois da troca."
          exit 1
