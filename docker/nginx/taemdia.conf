# Nginx de produção: única porta de entrada do sistema.
# Responsável por HTTPS, compressão e por servir a interface.

# Redireciona todo o tráfego HTTP para HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;

    # API, sob /api. Antes ela ocupava caminhos da raiz, e as telas do site
    # com o mesmo nome (/clientes, /cobrancas, /configuracoes, /assinaturas)
    # devolviam JSON quando alguém atualizava a página.
    location /api/ {
        # A barra no fim tira o /api antes de repassar: /api/clientes vira
        # /clientes para o backend, que não precisa saber do prefixo.
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Login do Google, que segue na raiz: o endereço de retorno já está
    # cadastrado no Google Cloud, e mudá-lo exigiria reconfigurar lá fora.
    # Só /auth/google entra aqui; /auth/callback é tela do site.
    location ~ ^/auth/google {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Interface (Angular já compilado)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
