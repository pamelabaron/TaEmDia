# Orquestra todos os serviços do TáEmDia com UM comando: docker compose up
# (Serviços do WhatsApp/Evolution serão adicionados no Sprint 5.)
services:
  # Banco de dados
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API (backend FastAPI)
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Comprovantes de assinatura. Fica fora de qualquer pasta pública: os
      # arquivos só saem pelo endpoint autenticado da administradora.
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Interface (frontend Angular) — servidor de desenvolvimento
  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
    command: npx ng serve --host 0.0.0.0 --poll 2000

  # WhatsApp (Evolution API). Só sobe quando pedido explicitamente:
  #   docker compose --profile whatsapp up -d
  # Enquanto não estiver ligada, o sistema roda em "modo simulador".
  evolution:
    image: atendai/evolution-api:v2.1.1
    profiles: ["whatsapp"]
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave}
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://backend:8000/whatsapp/webhook?token=${WEBHOOK_TOKEN:-}"
    volumes:
      - evolution-data:/evolution/instances

volumes:
  postgres-data:
  evolution-data:
  uploads-data:
