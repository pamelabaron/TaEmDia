name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend. Testes e cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taemdia
          POSTGRES_PASSWORD: taemdia
          POSTGRES_DB: taemdia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taemdia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://taemdia:taemdia@localhost:5432/taemdia
      JWT_SECRET: chave-de-teste-do-ci
      AGENDADOR_ATIVO: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o SonarCloud precisa do histórico completo

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Rodar os testes com cobertura
        working-directory: backend
        run: pytest

      - name: Guardar o relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: backend/coverage.xml

      - name: Análise no SonarCloud
        # Só roda quando o token estiver configurado nos segredos do repositório.
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v4

  frontend:
    name: Frontend. Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Compilar a aplicação
        working-directory: frontend
        run: npx ng build
