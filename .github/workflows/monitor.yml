name: Monitor

# Monitoramento básico do site no ar.
#
# A cada meia hora, consulta a API e a página. Se qualquer uma falhar, este
# fluxo fica vermelho e o GitHub avisa por e-mail quem é dona do repositório.
# Não depende de conta nova em serviço nenhum.
#
# A consulta à API não se contenta com "respondeu": o /health pergunta ao
# banco, e o monitor confere que a resposta diz "banco": "ok". Um 200 sozinho
# deixaria passar o caso mais traiçoeiro, que é a API viva com o banco parado.
#
# Ver docs/monitoramento.md.

on:
  schedule:
    # A cada 30 minutos. O GitHub pode atrasar alguns minutos em horário de
    # pico; para um sistema de cobrança, isso não muda nada.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vigiar:
    name: Conferir se o site está no ar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # -f faz o curl falhar com erro do servidor (502, 503); sem ele, até um
      # 502 passaria como sucesso. --retry insiste três vezes antes de acusar,
      # para uma oscilação de rede de um segundo não virar alarme.
      - name: A API e o banco respondem
        run: |
          resposta=$(curl -fsS --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 20 https://taemdia.duckdns.org/api/health)
          echo "Resposta: $resposta"
          echo "$resposta" | grep -q '"banco":"ok"' \
            || { echo "A API respondeu, mas o banco não."; exit 1; }

      - name: A página abre
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 20 -o /dev/null https://taemdia.duckdns.org/
          echo "A página respondeu."
